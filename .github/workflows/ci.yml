name: CI

on:
  push:
    branches: [main, master, staging, refactor/roughlike-survival-2.5d]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit
      - run: npm run lint -- --ignore-pattern test.js
      - run: npx tsc --noEmit
      - run: npm run typecheck:rooms
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-coverage-failure
          path: coverage/
          retention-days: 3

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      # Firefox uses a real X display; the other engines retain headless operation.
      - run: xvfb-run --auto-servernum npx playwright test --project=${{ matrix.browser }} --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 3
