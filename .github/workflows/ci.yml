name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm audit
      - run: npm run lint -- --ignore-pattern test.js
      - run: npx tsc --noEmit
      - run: npm run typecheck:rooms
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npx wrangler deploy --dry-run
      # Firefox needs an X display for its real WebGL context on the Linux runner.
      - run: xvfb-run --auto-servernum npm run test:e2e -- --headed
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 3
